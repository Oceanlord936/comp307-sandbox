<!doctype html>
<html>
  <head>
    <style>
      .center-div {
        width: 300px; /* must have a width */
        margin: auto; /* centres the box horizontally */
        border: 1px solid black;
        text-align: center;
        height: 60px;

        /* give round square coner */
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <div class="center-div">
      <p>This div is centered</p>
    </div>

    <br />

    <p>
      Observe: the 300px box sits in the middle of the page. Delete width: 300px
      and it fills the whole width, so there's nothing left to centre.
    </p>
  </body>
</html>
