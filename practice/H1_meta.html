<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="keywords" content="comp307 test tag" />
    <meta name="description" content="in class example" />

    <title>Lists</title>

    <!-- set attribute of body with background color to gray  -->
    <body bgcolor="gray">
      <!-- use "font" tag enclose some text to enforce font and color -->
      <!-- notice the actuall font is under "face" attribute  -->
      <font face="Arial" size="2" color="red">
        <!-- The ul element represents a list of items, 
        where the order of the items is not important 
        ul -> stand for un-order list but still list  -->
        <ul>
          <!-- The li element represents a list item -->
          <li>Hello</li>
        </ul>

        <!-- test invalid ul (no li child) 
        only the li tag enclosed get bullet point from ul  
        -->
        <ul>
          plain text
          <li>hello inside li</li>
        </ul>
      </font>
    </body>
  </head>
</html>
