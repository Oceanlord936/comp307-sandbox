<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Static Page</title>
    <style>
      table {
        font-family: Arial, sans-serif;

        /* Selects a table's border model.
        makes the borders of neighbouring table cells merge into a single line. */
        border-collapse: collapse;
        width: 100%;
      }
      td,
      th {
        border: 1px solid #dddddd;
        text-align: left;
        padding: 8px;
      }
      /* only apply to the even once of row  */
      tr:nth-child(even) {
        background-color: #dddddd;
      }
    </style>
  </head>

  <body>
    <table>
      <tr>
        <th>Company</th>
        <th>Contact</th>
        <!-- override css  -->
        <th style="width: 100px">Country</th>
      </tr>

      <tr>
        <td>Alfreds Futterkiste</td>
        <td>Maria Anders</td>
        <td>Germany</td>
      </tr>
      <tr>
        <td>Centro comercial Moctezuma</td>
        <td>Francisco Chang</td>
        <td>Mexico</td>
      </tr>
      <tr>
        <td>Ernst Handel</td>
        <td>Roland Mendel</td>
        <td>Austria</td>
      </tr>
      <tr>
        <td>Island Trading</td>
        <td>Helen Bennett</td>
        <td>UK</td>
      </tr>
      <tr>
        <td>Laughing Bacchus Winecellars</td>
        <td>Yoshi Tannamuri</td>
        <td>Canada</td>
      </tr>
      <tr>
        <td>Magazzini Alimentari Riuniti</td>
        <td>Giovanni Rovelli</td>
        <td>Italy</td>
      </tr>
    </table>
  </body>
</html>

<!-- 
Observe:

Static: the table stays 800px wide. Narrow the window and you get a horizontal scrollbar.
Liquid: the table always fills the window.
Every even row is shaded, and the header counts as row 1, so the first data row (Alfreds) is shaded.
Delete border-collapse: collapse and each cell gets its own border with a small gap, so you see double lines. -->
