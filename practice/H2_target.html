<!doctype html>

<html>
  <head>
    <meta charset="utf-8" />
    <title>Links</title>
  </head>

  <body>
    <!-- alt attribute is only show as text when image cannot load 
    used as place holder backup -->
    <img src="Good_dog.jpg" alt="a dog" />

    <!-- br as push space  -->
    <br />
    <!-- a is anchor 
    If the a element has an href attribute,
     then it represents a hyperlink (a hypertext anchor) 
     
     
     when anchor + target="_blank" attribute + href"some other hyper link "
     we jump to that in a new browser tab page 

     when we use anchor + name="Name_of_the_anchor" it mark down 
     we can make other anchor + href="#Name_of_the_anchor" to jump to that anchor place 
     
    -->
    <a href="table.html"> click here </a> <br />
    <a href="#HERE"> Jump down </a> <br />
    <a href="table.html" target="_blank"> Click for new page</a> <br />

    <br /><br /><br /><br /><br /><br /><br /><br /><br /><br />
    <br /><br /><br /><br /><br /><br /><br /><br /><br /><br />
    <br /><br /><br /><br /><br /><br /><br /><br /><br /><br />
    <br /><br /><br /><br /><br /><br /><br /><br /><br /><br />

    <a name="HERE"> this is the place we go to </a>
  </body>
</html>
