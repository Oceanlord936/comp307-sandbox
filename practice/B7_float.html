<!doctype html>
<html>
  <head>
    <style>
      /* ::after = "a virtual element placed after the content inside this element". */
      /* Without content, nothing is created. */
      /* Without display: table, clear has no effect. That's why the slide's // comment bug broke it. */
      .container ::after {
        border: 3px solid black;
        content: "";
        display: table;
        clear: both;
        overflow: hidden;
      }
      .left,
      .right {
        width: 300px;
        padding: 20px;
        float: left;
      }
      .left {
        background: #dfe6e9;
      }
      .right {
        background: #b2bec3;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="left">
        <h3>Left Column</h3>
        <p>Content for the left column goes here.</p>
      </div>

      <div class="right">
        <h3>Right Column</h3>
        <p>Content for the right column goes here.</p>
      </div>
    </div>

    <p>
      Observe: The boxes sit side by side, but the black border collapses to a
      thin line at the top. The parent's height is 0, because floated children
      are taken out of the normal flow.
    </p>
  </body>
</html>
