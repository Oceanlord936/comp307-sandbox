<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media query</title>
  <style>
    .left, .right {
      float: left;
      width: 20%;    /* default */
    }
    .main {
      float: left;
      width: 60%;    /* default */
    }

    /* added only so the boxes are visible */
    .left, .main, .right {
      background-color: #dddddd;
      padding: 10px;
      box-sizing: border-box;
    }

    /* breakpoint at 800px */
    @media screen and (max-width: 800px) {
      .left, .main, .right {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="left">Left</div>
  <div class="main">Main</div>
  <div class="right">Right</div>
</body>
</html>
