<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auto scaling</title>
  <style>
    body {
      font-family: sans-serif;
      line-height: 1.5;
      padding: 0 16px;
    }
    article {
      width: 66%;
      float: left;
    }
    aside {
      width: 33%;
      float: right;
    }
  </style>
</head>
<body>
  <article>
    <h2>Article</h2>
    <p>This is the main text. It takes about two thirds of the width and scales as you resize the window.</p>
  </article>
  <aside>
    <h2>Aside</h2>
    <p>This is the side note, about one third.</p>
  </aside>
</body>
</html>
