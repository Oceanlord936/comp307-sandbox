<!doctype html>
<html lang="en">
  <head>
    <title>CSS Template</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /* Comment out * { box-sizing: border-box; } and reload. 
        The article drops below the nav, 
        because 30% + 70% plus the padding is more than 100%. */
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      .header {
        background-color: #666;
        padding: 30px;
        text-align: center;
        font-size: 35px;
        color: white;
      }
      nav {
        float: left;
        width: 30%;
        height: 300px;
        background: #ccc;
        padding: 20px;
      }
      nav ul {
        list-style-type: none;
        padding: 0;
      }
      article {
        float: left;
        padding: 20px;
        width: 70%;
        background-color: #f1f1f1;
        height: 300px;
      }
      /* use ::after to add extra after this , the content is ""  */

      /* Comment out the .section::after rule. 
      The footer rides up and overlaps the columns, 
      because .section collapses. */

      .section::after {
        content: "";
        display: table;
        clear: both;
      }
      footer {
        background-color: #777;
        padding: 10px;
        text-align: center;
        color: white;
      }

      @media (max-width: 500px) {
        /* Observe: drag the window narrower than 600px. 
        The nav and article stack, each full width. Above 600px it goes back to two columns. */
        nav,
        artical {
          /* when less than 500px , use the 100 percent width for artical section 
          previously 70 percent 
          */
          width: 100%;
          height: auto;
        }
      }
    </style>
  </head>

  <body>
    <h2>CSS Layout Float</h2>

    <div class="header">
      <h2>Cities</h2>
    </div>

    <div class="section">
      <nav>
        <ul>
          <!-- empty href link use # as placeholder  -->
          <li><a href="#">London</a></li>
          <li><a href="#">Paris</a></li>
          <li><a href="#">Tokyo</a></li>
        </ul>
      </nav>

      <article>
        <h1>London</h1>
        <p>
          London is the capital city of England. It is the most populous city in
          the United Kingdom.
        </p>
        <p>
          Standing on the River Thames, London has been a major settlement for
          two millennia.
        </p>
      </article>
    </div>

    <footer>
      <p>Footer</p>
    </footer>
  </body>
</html>
