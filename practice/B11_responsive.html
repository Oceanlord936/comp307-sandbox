<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Adjustable Page 2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      video {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>

  <body>
    <h2>Responsive Image</h2>

    <img src="Good_dog.jpg" style="width: 100%" />

    <p>The picture changes at 600px and 1500px.</p>

    <picture>
      <source srcset="img_smallflower.jpg" media="(max-width: 600px)" />
      <source srcset="img_flowers.jpg" media="(max-width: 1500px)" />
      <source srcset="flowers.jpg" />
      <img src="img_flowers.jpg" alt="Flowers" style="width: auto" />
    </picture>

    <!-- inline css for size : vw means "viewport width". The viewport is the browser
    window's visible area. 1vw = 1% of the window's width. So font-size: 10vw
    means the text is 10% of the window width. In a 1000px-wide window the text
    is 100px, and in a 500px window it's 50px. It scales as you drag the window. -->

    <!-- % and vw are different: % is relative to the parent element, vw is relative to the window. vh is the same idea for height. -->

    <!-- notice : vw sets the size of the letters, not how wide the text is. -->
    <h1 style="font-size: 8vw">Responsive Text</h1>
    <p style="font-size: 5vw">Resize the window to see this text scale.</p>

    <video width="400" controls>
      <source
        src="https://www.w3schools.com/html/mov_bbb.mp4"
        type="video/mp4"
      />
      Your browser does not support HTML5 video.
    </video>
  </body>
</html>
