<!doctype html>
<html>
  <body>
    <h2>
      "JavaScript Functions", a paragraph "This example calls a function to
      convert from Fahrenheit to Celsius:"
    </h2>
    <p id="demo"></p>

    <script>
      function toCelsius(f) {
        return (5 / 9) * (f - 32);
      } // ✅ works: "hoisted"

      //   const toCelsius = (f) => {
      //     return (5 / 9) * (f - 32);
      //   }; // ❌ ReferenceError

      // place reuslt in side empty demo p tag
      document.getElementById("demo").innerHTML = toCelsius(77);
    </script>
  </body>
</html>
