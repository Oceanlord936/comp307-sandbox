<!doctype html>

<html>
  <body>
    <!-- idea:
    borwser calls you listener , it passes in one argument :
    an event obkect that decribes what just happened . 


    btn here is the html element 

    btn.addEventListener("click", function (e) {
    console.log(e.type);    // "click"
    console.log(e.target);  // the element that was clicked
    });

    You've already used it once: 
    event.key in J4c came from the event object of a keydown.

    For mouse events, e.button tells you which button was pressed:

    e.button 0 -> left 
    e.button 1 -> middle (wheel)
    e.button 2 -> right 

     -->

    <p id="out"></p>

    <div
      id="divBox"
      role="button"
      style="
        cursor: pointer;
        width: 200px;
        height: 100px;
        border-radius: 10%;
        border: 2px solid black;
      "
    >
      click me !
    </div>

    <div id="box">click me 2</div>

    <script>
      let divBoxEle = document.getElementById("divBox");

      // attache a mouse down
      divBoxEle.addEventListener("mousedown", myAction);

      // pervent browser show right click manuel
      divBoxEle.addEventListener("contextmenu", function (e) {
        e.preventDefault();
      });

      function myAction(e) {
        let pEle = document.getElementById("out");

        switch (e.button) {
          case 0:
            pEle.innerHTML = "left " + typeAndId(e);
            break;

          case 1:
            pEle.innerHTML = "mid " + typeAndId(e);
            break;

          case 2:
            pEle.innerHTML = "right " + typeAndId(e);
            break;

          // the other button case
          default:
            console.log("button:", e.button);
            pEle.innerHTML = "other button: " + e.button;
        }
      }

      function typeAndId(e) {
        return e.type + " " + e.target.id;
      }
    </script>
  </body>
</html>
