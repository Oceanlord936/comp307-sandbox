<!doctype html>

<html>
  <body>
    <!-- idea:
    borwser calls you listener , it passes in one argument :
    an event obkect that decribes what just happened . 


    btn here is the html element 

    btn.addEventListener("click", function (e) {
    console.log(e.type);    // "click"
    console.log(e.target);  // the element that was clicked
    });

    You've already used it once: 
    event.key in J4c came from the event object of a keydown.

    For mouse events, e.button tells you which button was pressed:

    e.button 0 -> left 
    e.button 1 -> middle (wheel)
    e.button 2 -> right 

     -->

    <p id="out"></p>

    <div
      id="box"
      role="button"
      style="
        cursor: pointer;
        width: 200px;
        height: 100px;
        border-radius: 10%;
        border: 2px solid black;
      "
    >
      click me !
    </div>

    <script>
      let divBoxEle = document.getElementById("box");

      let p = document.getElementById("out");
      // one click listener; modifiers come from e.shiftKey / e.ctrlKey / e.altKey

      divBoxEle.addEventListener("click", myAction);

      function myAction(e) {
        // reset on every click, so old text doesn't pile up
        let msg = "";

        if (e.shiftKey) {
          msg += "Shift + ";
        }
        if (e.ctrlKey) {
          msg += "Ctrl + ";
        }
        if (e.altKey) {
          msg += "Alt + ";
        }
        msg += "click";

        p.innerHTML = msg;
      }
    </script>
  </body>
</html>
