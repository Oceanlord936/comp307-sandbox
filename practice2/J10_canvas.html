<!doctype html>

<html>
  <!-- The idea: <canvas> is an empty drawing surface. 
        HTML only sets its size; 
        all drawing is done in JS through a "context": -->
  <body>
    <canvas
      id="myCanvas"
      width="200"
      height="100"
      style="border: 1px solid #000"
    >
      Your browser does not support canvas.
      <!-- shown only by old browsers -->
    </canvas>

    <script>
      let c = document.getElementById("myCanvas");
      let ctx = c.getContext("2d"); // the drawing tool: every draw call goes through ctx
      ctx.moveTo(0, 0); // lift the pencil and move it to (0,0), no drawing yet
      ctx.lineTo(200, 100); // plan a line to (200,100), still nothing visible
      ctx.stroke(); // actually draw the planned path

      ctx.moveTo(200, 0);
      ctx.lineTo(0, 100);
      ctx.stroke();
    </script>
  </body>
</html>
